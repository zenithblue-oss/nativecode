AntiFeatures:
  NonFreeNet:
    en-US: Talks to proprietary AI vendor services (OpenAI, Anthropic, Google, xAI and others) when the user signs in to and uses their command line tools.
  NonFreeAdd:
    en-US: The downloaded Linux environment ships proprietary AI command line tools pre-installed (Claude Code, Antigravity, Grok, Kiro), each under its vendor's own license.
  NonFreeAssets:
    en-US: The downloaded root filesystem and runtime update pack contain proprietary executables (Claude Code, Antigravity, Grok, Kiro), and the downloaded Android SDK pack contains Google's Android SDK components under Google's license. They are not part of this app's source code.
  TetheredNet:
    en-US: Downloads the Linux root filesystem (about 1.26 GB), the runtime update pack, the Android SDK pack and the GPU drivers (Mesa PanVK, Turnip) from GitHub Releases after an in-app opt-in.
