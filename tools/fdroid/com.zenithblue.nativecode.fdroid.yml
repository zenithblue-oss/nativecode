AntiFeatures:
  NonFreeNet:
    en-US: Talks to proprietary AI vendor services (OpenAI, Anthropic, Google, xAI and others) when the user signs in to and uses their command line tools.
  NonFreeAdd:
    en-US: Can install proprietary AI command line tools (Claude Code, Antigravity, Grok, Kiro) inside the Linux environment on explicit user request.
  TetheredNet:
    en-US: Downloads the Linux root filesystem (about 1.26 GB), the runtime update pack, the Android SDK pack and the GPU drivers (Mesa PanVK, Turnip) from GitHub Releases after an in-app opt-in.
